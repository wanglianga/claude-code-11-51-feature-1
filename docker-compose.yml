version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: metric-db
    environment:
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
      POSTGRES_DB: ccdev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: metric-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ccdev
      SPRING_DATASOURCE_USERNAME: ccdev
      SPRING_DATASOURCE_PASSWORD: ccdev
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # JRE 基础镜像不一定带 curl；用 bash 的 /dev/tcp 检查 8080 是否可连接
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    container_name: metric-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
